<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NKZS Build Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <section id="config"></section>
    <main id="stage">
      <div id="viewer"></div>
      <div id="stage-top"></div>
      <div id="stage-bottom"></div>
      <div id="empty-stage" hidden>
        <div class="empty-inner">
          <div class="logo-big">NKZS<span>Build Studio</span></div>
          <p>Wähle links einen Kunden und einen Build, oder lege einen neuen an.</p>
        </div>
      </div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="print-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
